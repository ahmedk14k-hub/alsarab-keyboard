name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate project
        run: |
          if [ -f settings.gradle ]; then
            echo "PROJ=." >> "$GITHUB_ENV"
          else
            Z=$(ls ./*.zip 2>/dev/null | head -1 || true)
            if [ -n "$Z" ]; then mkdir -p _proj && unzip -q "$Z" -d _proj; fi
            S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
            if [ -z "$S" ]; then echo "settings.gradle not found"; exit 1; fi
            echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          fi

      - name: Make R ids constants (needed by switch/case)
        run: |
          grep -q 'android.nonFinalResIds' "$PROJ/gradle.properties" || echo 'android.nonFinalResIds=false' >> "$PROJ/gradle.properties"
          cat "$PROJ/gradle.properties"

      - name: Build debug APK
        run: |
          set -o pipefail
          cd "$PROJ"
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/Alsarab-Keyboard.apk"

      - name: Summarize errors
        if: failure()
        run: |
          grep -E "error:|ERROR:" "$GITHUB_WORKSPACE/build.log" | sed -E 's#^.*/app/src/main/##' | sort -u | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Alsarab-Keyboard-APK
          path: out/Alsarab-Keyboard.apk
