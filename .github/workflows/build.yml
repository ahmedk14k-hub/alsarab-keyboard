name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip and build
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
          DIR=$(dirname "$(find /tmp/proj -name settings.gradle | head -n1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/Alsarab-Keyboard.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Alsarab-Keyboard
          path: out/Alsarab-Keyboard.apk
